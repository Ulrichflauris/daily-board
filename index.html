<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>daily-board — Console YC/OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/windows.css">
</head>
<body>
<header class="menubar">
  <span class="brand">YC/OS 1.0</span>
  <span>Fichier</span><span>&Eacute;dition</span><span>Vue</span><span>Fen&ecirc;tre</span><span>Aide</span>
  <span class="right" id="menubar-clock">&mdash;</span>
</header>
<main class="desktop" id="desktop">
  <section class="win active" data-widget="clock" style="left:6%;top:10%">
    <div class="title"><div class="dots"><span></span><span></span><span></span></div><span class="code">CLK-00</span>Horloge</div>
    <div class="content"></div>
  </section>
  <section class="win" data-widget="tasks" style="left:6%;top:52%">
    <div class="title"><div class="dots"><span></span><span></span><span></span></div><span class="code">TSK-01</span>Pense-b&ecirc;te</div>
    <div class="content"></div>
  </section>
  <section class="win" data-widget="weather" style="left:47%;top:8%">
    <div class="title"><div class="dots"><span></span><span></span><span></span></div><span class="code">WTHR-02</span>M&eacute;t&eacute;o — Rennes</div>
    <div class="content"></div>
  </section>
  <section class="win" data-widget="news" style="left:49%;top:44%">
    <div class="title"><div class="dots"><span></span><span></span><span></span></div><span class="code">INTL-03</span>D&eacute;p&ecirc;ches — veille cyber</div>
    <div class="content"></div>
  </section>
</main>
<footer class="statusbar">
  <span>SYS <span class="ok">OK</span> — RENNES 48.11N / 1.67W</span>
  <span id="status-tasks">TSK — ACTIVES</span>
  <span id="status-session">SESSION — CET</span>
</footer>
<script src="config/config.js"></script>
<script src="assets/js/core/storage.js"></script>
<script src="assets/js/core/boot.js"></script>
<script src="assets/js/core/windows.js"></script>
<script src="assets/js/widgets/clock.js"></script>
<script src="assets/js/widgets/tasks.js"></script>
<script src="assets/js/widgets/weather.js"></script>
<script src="assets/js/widgets/news.js"></script>
</body>
</html>
